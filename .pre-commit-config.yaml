repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.6
    hooks:
      - id: uv-lock
      - id: uv-export

  - repo: local
    hooks:
      # same check as the CI lint job: the whole package with the GUI packages, whose types trajectopy.gui needs
      - id: mypy
        name: Type check (mypy)
        entry: uv run --extra gui mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest
        name: Run unit tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
