name: Release

# Pushing a version tag (e.g. v5.1.0, matching trajectopy/__version__.py) builds the Windows installer and
# attaches it to the GitHub release of that tag (created with generated notes if it does not exist yet).
# The update check of installed apps then finds the new version.
# Running the workflow manually only builds the installer and keeps it as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev --extra gui

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(uv run python -c "from trajectopy.__version__ import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Build the app
        run: uv run pyinstaller --noconfirm trajectopy.spec

      - name: Check that the app starts
        run: dist\Trajectopy\Trajectopy.exe --version

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\trajectopy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Trajectopy-${{ steps.version.outputs.version }}-setup
          path: dist/Trajectopy-${{ steps.version.outputs.version }}-setup.exe

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Trajectopy-${{ steps.version.outputs.version }}-setup.exe
          generate_release_notes: true
